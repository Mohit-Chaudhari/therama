<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <!-- Very cool tech gradient -->
        <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4" /> <!-- Cyan -->
            <stop offset="50%" stop-color="#3B82F6" /> <!-- Blue -->
            <stop offset="100%" stop-color="#4F46E5" /> <!-- Indigo -->
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.3" />
        </filter>
    </defs>
    
    <!-- Transparent/Clean Background -->
    
    <!-- Shadow effect for the loop -->
    <path d="M 20 50 C 20 15 50 15 50 50 C 50 85 80 85 80 50 C 80 15 50 15 50 50 C 50 85 20 85 20 50 Z" 
          stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.1" transform="translate(0, 4)" />
          
    <!-- Beautiful Infinity / Abstract 'S' path representing continuous Seva -->
    <path d="M 20 50 C 20 15 50 15 50 50 C 50 85 80 85 80 50 C 80 15 50 15 50 50 C 50 85 20 85 20 50 Z" 
          stroke="url(#infGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
          
    <!-- Core value center dot (Saffron/Gold accent) -->
    <circle cx="50" cy="50" r="10" fill="#F97316" />
    <circle cx="50" cy="50" r="6" fill="#FDBA74" />
</svg>
